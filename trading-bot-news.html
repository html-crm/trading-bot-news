<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Helm · News-Driven Trading Bot (Paper)</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#090c1a;--pn:#121733;--pn2:#192045;--ln:#262f5c;--ink:#e8ebff;--mu:#8b94c7;--up:#4fe3b0;--dn:#ff6b7f;--ac:#8d7bff;--wn:#ffc15e}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef0fb;--pn:#fff;--pn2:#f1f3ff;--ln:#d5daf2;--ink:#161a3a;--mu:#5c6590;--up:#0a8f68;--dn:#d2364d;--ac:#5b47e0;--wn:#b9780c}}
:root[data-theme="light"]{--bg:#eef0fb;--pn:#fff;--pn2:#f1f3ff;--ln:#d5daf2;--ink:#161a3a;--mu:#5c6590;--up:#0a8f68;--dn:#d2364d;--ac:#5b47e0;--wn:#b9780c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Space Grotesk",system-ui,sans-serif}
.m{font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px}
.logo{font-weight:700;font-size:20px}.logo i{color:var(--ac);font-style:normal}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{padding:4px 10px;border-radius:99px;border:1px solid var(--ln);font-size:12px;display:inline-flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);animation:pu 1.2s infinite}.off .dot{background:var(--dn);animation:none}
@keyframes pu{0%{box-shadow:0 0 0 0 var(--up)}100%{box-shadow:0 0 0 9px transparent}}
button,select,input{font:inherit;color:var(--ink);background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:8px 12px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}.kill{background:var(--dn);border-color:var(--dn);color:#fff;font-weight:700}
.seg{display:flex}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:8px 0 0 8px;margin:0}.seg button:last-child{border-radius:0 8px 8px 0}.seg .on{background:var(--ac);border-color:var(--ac);color:#fff}
main{max-width:1280px;margin:0 auto;padding:0 16px 16px;display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.p{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:16px;grid-column:span 12;min-width:0}
@media(min-width:960px){.c7{grid-column:span 7}.c5{grid-column:span 5}.c4{grid-column:span 4}}
h2{font-size:13px;font-weight:500;color:var(--mu);margin:0 0 10px}
.news{max-height:430px;overflow:auto}
.ni{padding:10px;border-radius:10px;background:var(--pn2);margin-bottom:8px;border-left:4px solid var(--ln);animation:sl .4s}
.ni.b{border-color:var(--up)}.ni.s{border-color:var(--dn)}
@keyframes sl{from{opacity:0;transform:translateY(-10px)}}
.tag{font-size:11px;padding:1px 7px;border-radius:5px;background:var(--ln)}
.imp{height:4px;background:var(--ln);border-radius:2px;margin-top:6px}.imp i{display:block;height:100%;border-radius:2px;background:var(--wn)}
.rail{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.rail span{padding:4px 9px;border-radius:6px;font-size:11.5px;background:var(--pn2);color:var(--mu)}
.rail .on{color:#fff;background:var(--ac);box-shadow:0 0 14px var(--ac)}
.dec{border:1px solid var(--ac);border-radius:12px;padding:14px;animation:sl .35s}
.act{font-size:26px;font-weight:700}.bar2{height:6px;background:var(--ln);border-radius:3px;margin:6px 0 10px}.bar2 i{display:block;height:100%;background:var(--ac);border-radius:3px}
ul{margin:6px 0;padding-left:18px}.ck{list-style:none;padding:0}.ck li{padding:2px 0;animation:sl .3s}
.sg{display:grid;grid-template-columns:52px 1fr 62px;gap:8px;align-items:center;margin-bottom:9px}
.g{position:relative;height:10px;background:var(--pn2);border-radius:5px}.g:after{content:"";position:absolute;left:50%;top:-2px;width:1px;height:14px;background:var(--mu)}
.g i{position:absolute;top:0;height:100%;border-radius:5px;transition:all .5s}
.pos{background:var(--pn2);border-radius:10px;padding:10px;margin-bottom:8px}
.mt{height:6px;background:var(--ln);border-radius:3px;margin:3px 0 10px}.mt i{display:block;height:100%;border-radius:3px;transition:width .5s}
canvas{width:100%;display:block}
.log{max-height:260px;overflow:auto;font-size:12.5px}.log div{padding:4px 0;border-bottom:1px solid var(--ln);animation:sl .3s}.log b{display:inline-block;min-width:150px;color:var(--ac)}
.ban{display:none;background:var(--dn);color:#fff;padding:10px 16px;font-weight:700}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f>*{width:100%}
</style></head><body>
<div class="bar">
 <div class="logo">HELM<i>.</i> <span class="mu" style="font-weight:400;font-size:13px">news-driven trading bot</span></div>
 <div class="row">
  <span class="pill" id="live"><span class="dot"></span><span id="lt">WATCHING · simulated news</span></span>
  <span class="pill" style="color:var(--wn);border-color:var(--wn)">PAPER TRADING</span>
  <div class="seg" id="modes"><button data-m="MANUAL">Manual</button><button data-m="TOKEN_SELECTION">Bot proposes</button><button data-m="FULL_AUTONOMOUS">Autonomous</button></div>
  <button class="kill" id="kill">Kill switch</button>
 </div>
</div>
<div class="ban" id="ban">TRADING DISABLED — no new trades. All positions closed at market.</div>
<main>
 <section class="p c7"><h2>News the bot is reading</h2><div class="news" id="news"></div></section>
 <section class="p c5"><h2>Bot decision · <span id="md"></span></h2><div class="rail" id="rail"></div><div id="dec"></div></section>
 <section class="p c4"><h2>Sentiment signal per token (−100 to +100)</h2><div id="sig"></div></section>
 <section class="p c4"><h2>Open positions</h2><div id="pos"></div></section>
 <section class="p c4"><div class="row" style="justify-content:space-between;align-items:flex-end"><div><h2 style="margin:0">Portfolio</h2><div class="m" style="font-size:28px;font-weight:600" id="eq"></div></div><div class="m" id="pl"></div></div>
  <canvas id="ch" height="70"></canvas><div id="risk" style="margin-top:8px"></div>
  <div class="f"><select id="tk"></select><input id="sz" type="number" value="100" min="1" aria-label="Size USD"></div>
  <div class="row" style="margin-top:8px"><button class="pri" id="buy">Buy (manual)</button><span class="mu" id="bm"></span></div></section>
 <section class="p" style="grid-column:span 12"><h2>Audit stream — why it chose, bought and sold</h2><div class="log m" id="log"></div></section>
</main>
<script>
(function(){
var C={SIZE:100,MAXP:3,MAXS:250,MAXE:600,DAILY:150,MINC:.65,BUYT:45,SELLT:35,SL:3,TP:5,HOLD:140};
var $=function(i){return document.getElementById(i)};
var T=[["SOL",140],["AVAX",32],["LINK",15],["ARB",.9],["INJ",24],["RNDR",7],["DOGE",.16],["NEAR",5.2]].map(function(a){return{t:a[0],p:a[1],dr:0,sig:0}});
var SRC=["ChainDesk","MarketPulse","OnChainLens","RegWatch","NewsWire"];
var TPL=[["{T} lists on a major exchange",1,60],["Whale wallets accumulate {T} for a third day",1,40],["Payments giant integrates {T}",1,55],["Analysts upgrade {T} outlook",1,35],["{T} mainnet upgrade ships on schedule",1,28],["Regulator opens probe into {T} foundation",-1,60],["{T} bridge exploit drains funds",-1,85],["{T} upgrade delayed again",-1,32],["Large {T} token unlock scheduled this week",-1,36],["{T} developers publish routine update",0,8]];
var S={mode:"MANUAL",on:true,st:"WAITING_FOR_SIGNAL",cash:1e4,start:1e4,real:0,day:0,loss:0,pos:[],news:[],q:[],dec:null,ttl:0,nt:3,cool:0,id:1,eh:[]};
var ST=["SCANNING","ANALYZING","WAITING_FOR_SIGNAL","RISK_CHECK","ENTERING","POSITION_OPEN","MANAGING_POSITION","EXITING","COOLDOWN","STOPPED"];
var MD={MANUAL:"watching only, you decide",TOKEN_SELECTION:"bot proposes, you approve",FULL_AUTONOMOUS:"bot decides and trades"};
function f(n,d){d=d==null?2:d;return Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d})}
function fp(p){return f(p,p<.01?6:p<10?3:2)}
function K(t){return T.filter(function(k){return k.t===t})[0]}
function held(t){return S.pos.filter(function(p){return p.t===t})[0]}
function expo(){return S.pos.reduce(function(a,p){return a+p.size},0)}
function unr(){return S.pos.reduce(function(a,p){return a+(K(p.t).p/p.entry-1)*p.size},0)}
function eq(){return S.cash+expo()+unr()}
function log(e,m){var d=document.createElement("div");d.innerHTML="<b>"+e+"</b><span class=mu>"+new Date().toLocaleTimeString()+"</span> "+m;$("log").prepend(d);while($("log").children.length>70)$("log").lastChild.remove()}
function sg(v){return(v>=0?"+":"")+f(v,0)}

function risk(d){var c=[];function a(n,ok){c.push({n:n,ok:ok})}
 if(d.a==="BUY"){a("Trading enabled",S.on);a("Balance covers $"+d.size,d.size<=S.cash);a("Size within $"+C.MAXS+" limit",d.size<=C.MAXS);a("Open positions below "+C.MAXP,S.pos.length<C.MAXP);a("Not already holding "+d.t,!held(d.t));a("Total exposure within $"+C.MAXE,expo()+d.size<=C.MAXE);a("Daily loss under $"+C.DAILY,S.day>-C.DAILY);a("Loss streak below 3",S.loss<3);a("Confidence at least "+C.MINC,d.conf>=C.MINC)}
 else a("Position in "+d.t+" exists",!!held(d.t));return c}
function pass(c){return c.every(function(x){return x.ok})}
function buy(d,why){var k=K(d.t),sl=Math.random()*.4,fill=k.p*(1+sl/100),fee=d.size*.001;
 log("ORDER_SUBMITTED","BUY "+d.t+" $"+f(d.size,0)+" (paper)");S.cash-=d.size+fee;S.real-=fee;
 var o={id:"P"+S.id++,t:d.t,entry:fill,size:d.size,age:0,sl:fill*(1-C.SL/100),tp:fill*(1+C.TP/100),why:why};S.pos.push(o);
 log("ORDER_FILLED",d.t+" @ "+fp(fill)+", slippage "+f(sl)+"%");log("POSITION_OPENED",o.id+" "+d.t+" — reason: "+why)}
function sell(p,why){log("SELL_SUBMITTED",p.t+" — "+why);var pl=(K(p.t).p/p.entry-1)*p.size-p.size*.001;
 S.cash+=p.size+pl;S.real+=pl;S.day+=pl;S.loss=pl>0?0:S.loss+1;S.pos=S.pos.filter(function(x){return x!==p});log("POSITION_CLOSED",p.id+" "+p.t+" P&L $"+f(pl)+" ("+why+")")}

function addNews(){
 var t=T[Math.floor(Math.random()*T.length)],h=held(t.t),pool=TPL;
 var x=pool[Math.floor(Math.random()*pool.length)];if(h&&Math.random()<.4)x=TPL[5+Math.floor(Math.random()*4)];
 var n={src:SRC[Math.floor(Math.random()*SRC.length)],h:x[0].replace("{T}",t.t),t:t.t,d:x[1],i:x[2],time:new Date().toLocaleTimeString()};
 var delta=n.d*n.i*(.9+Math.random()*.2);t.sig=Math.max(-100,Math.min(100,t.sig+delta));t.dr+=n.d*n.i*.00001;n.delta=delta;
 S.news.unshift(n);if(S.news.length>14)S.news.pop();
 log("NEWS_RECEIVED",n.src+": "+n.h+" ("+(n.d>0?"bullish":n.d<0?"bearish":"neutral")+", impact "+n.i+")");
 log("SIGNAL_UPDATED",t.t+" signal now "+sg(t.sig));return n}
function think(n){
 var k=K(n.t),a=null;
 if(S.mode==="MANUAL"){S.dec={a:"WATCH",t:n.t,why:["Manual mode: the bot only watches and updates signals.","Latest: "+n.h],status:"no action",sig:k.sig};return}
 if(!held(k.t)&&k.sig>=C.BUYT&&S.cool<=0&&!(S.dec&&S.dec.pend))a="BUY";else if(held(k.t)&&k.sig<=-C.SELLT)a="SELL";
 var why=S.news.filter(function(x){return x.t===k.t&&x.d!==0}).slice(0,3).map(function(x){return x.src+": "+x.h+" ("+sg(x.d*x.i)+")"});
 if(!a){S.dec={a:"HOLD",t:k.t,why:["Signal "+sg(k.sig)+" is inside thresholds (buy ≥ +"+C.BUYT+", sell ≤ −"+C.SELLT+")","Latest: "+n.h],status:"no action",sig:k.sig};log("DECISION_HOLD",k.t+" signal "+sg(k.sig)+", no action");S.q=[];return}
 S.dec={a:a,t:k.t,size:C.SIZE,conf:Math.min(.95,.45+Math.abs(k.sig)/130),why:why.concat(["Aggregate signal "+sg(k.sig)]),status:"checking risk",sig:k.sig,checks:null};
 log("TRADE_PROPOSED",a+" "+k.t+", confidence "+f(S.dec.conf)+" — based on: "+why.join(" | "));
 S.q=["RISK_CHECK"].concat(S.mode==="FULL_AUTONOMOUS"?[a==="BUY"?"ENTERING":"EXITING"]:[])}
function execDec(d){
 if(d.a==="BUY")buy(d,d.why[0]);else{var p=held(d.t);if(p)sell(p,"bearish news: "+d.why[0])}
 d.status="executed";d.pend=false;S.ttl=0}
function approve(){var d=S.dec;if(!d||!d.pend)return;d.checks=risk(d);if(!pass(d.checks)){log("RISK_REJECTED",d.a+" "+d.t+" blocked at approval");d.status="rejected by risk engine";d.pend=false}else{log("RISK_APPROVED",d.t+" approved by you and risk engine");execDec(d)}render()}
function reject(){var d=S.dec;d.status="rejected by you";d.pend=false;log("RISK_REJECTED",d.a+" "+d.t+" rejected by user");render()}

function step(){
 T.forEach(function(k){k.dr=k.dr*.97+(Math.random()-.5)*.0004;k.p*=1+k.dr+(Math.random()-.5)*.003;k.sig*=.992});
 S.pos.slice().forEach(function(p){p.age++;var c=K(p.t).p;
  if(c<=p.sl){log("EXIT_SIGNAL",p.t+" stop-loss");sell(p,"stop-loss")}else if(c>=p.tp){log("EXIT_SIGNAL",p.t+" take-profit");sell(p,"take-profit")}else if(p.age>=C.HOLD){log("EXIT_SIGNAL",p.t+" max hold time");sell(p,"max hold time")}});
 S.eh.push(eq());if(S.eh.length>150)S.eh.shift();
 if(S.dec&&S.dec.pend&&--S.ttl<=0){S.dec.status="expired";S.dec.pend=false;log("TRADE_PROPOSED","proposal for "+S.dec.t+" expired")}
 if(!S.on){S.st="STOPPED";S.q=[]}
 else if(S.q.length){var s=S.q.shift();S.st=s;var d=S.dec;
  if(s==="RISK_CHECK"){d.checks=risk(d);if(!pass(d.checks)){d.status="rejected by risk engine";log("RISK_REJECTED",d.a+" "+d.t+": "+d.checks.filter(function(x){return !x.ok}).map(function(x){return x.n}).join(", "));S.q=[]}
   else{log("RISK_APPROVED",d.a+" "+d.t+" passed "+d.checks.length+" checks");if(S.mode==="TOKEN_SELECTION"){d.pend=true;d.status="waiting for your approval";S.ttl=25}else d.status="approved, executing"}}
  else if(s==="ENTERING"||s==="EXITING"){execDec(d);if(s==="ENTERING")S.cool=6}}
 else{
  if(--S.nt<=0){S.nt=6+Math.floor(Math.random()*5);var n=addNews();S.st="ANALYZING";think(n);if(S.q.length===0&&S.dec&&S.dec.a!=="WATCH"&&S.dec.a!=="HOLD")S.st="WAITING_FOR_SIGNAL"}
  else if(S.cool>0){S.cool--;S.st="COOLDOWN"}
  else S.st=S.dec&&S.dec.pend?"WAITING_FOR_SIGNAL":S.pos.length?(S.mode==="FULL_AUTONOMOUS"?"MANAGING_POSITION":"POSITION_OPEN"):"WAITING_FOR_SIGNAL"}
 render()}

function spark(c,d){var w=c.clientWidth,h=70,r=window.devicePixelRatio||1;c.width=w*r;c.height=h*r;var x=c.getContext("2d");x.scale(r,r);if(d.length<2)return;
 var mn=Math.min.apply(0,d),mx=Math.max.apply(0,d),pd=(mx-mn)||1,up=d[d.length-1]>=d[0],cs=getComputedStyle(document.documentElement),col=cs.getPropertyValue(up?"--up":"--dn").trim();
 x.beginPath();d.forEach(function(v,i){var X=i/(d.length-1)*w,Y=h-4-(v-mn)/pd*(h-8);i?x.lineTo(X,Y):x.moveTo(X,Y)});x.strokeStyle=col;x.lineWidth=2;x.stroke()}

function render(){
 var e=eq(),d=e-S.start;$("eq").textContent="$"+f(e);$("pl").innerHTML="<span class='"+(d>=0?"up":"dn")+"'>"+(d>=0?"▲":"▼")+" $"+f(Math.abs(d))+"</span><div class=mu style='font-size:11px'>realized $"+f(S.real)+"</div>";
 $("md").textContent=MD[S.mode];
 $("modes").querySelectorAll("button").forEach(function(b){b.classList.toggle("on",b.dataset.m===S.mode)});
 $("rail").innerHTML=ST.map(function(s){return "<span class='"+(s===S.st?"on":"")+"'>"+s.replace(/_/g," ").toLowerCase()+"</span>"}).join("");
 $("news").innerHTML=S.news.length?S.news.map(function(n){return "<div class='ni "+(n.d>0?"b":n.d<0?"s":"")+"'><div class=row style='justify-content:space-between'><span class=mu style='font-size:12px'>"+n.src+" · "+n.time+"</span><span><span class=tag>"+n.t+"</span> <span class='m "+(n.d>0?"up":n.d<0?"dn":"mu")+"'>"+(n.d>0?"bullish":n.d<0?"bearish":"neutral")+" "+sg(n.d*n.i)+"</span></span></div><div style='margin-top:4px'>"+n.h+"</div><div class=imp><i style='width:"+n.i+"%'></i></div></div>"}).join(""):"<div class=mu>Waiting for the first headline…</div>";
 var d2=S.dec;
 $("dec").innerHTML=d2?"<div class=dec><div class=row style='justify-content:space-between'><span class='act "+(d2.a==="BUY"?"up":d2.a==="SELL"?"dn":"mu")+"'>"+d2.a+" "+d2.t+"</span><span class=mu>"+d2.status+"</span></div>"+(d2.conf!=null?"<div class=mu style='font-size:12px'>confidence "+f(d2.conf*100,0)+"%</div><div class=bar2><i style='width:"+d2.conf*100+"%'></i></div>":"")+"<b style='font-size:12px' class=mu>Why</b><ul>"+d2.why.map(function(w){return "<li>"+w+"</li>"}).join("")+"</ul>"+(d2.checks?"<b style='font-size:12px' class=mu>Risk engine</b><ul class=ck>"+d2.checks.map(function(c){return "<li class='"+(c.ok?"up":"dn")+"'>"+(c.ok?"✓ ":"✗ ")+c.n+"</li>"}).join("")+"</ul>":"")+(d2.pend?"<div class=row><button class=pri id=ap>Approve</button><button id=rj>Reject</button></div>":"")+"</div>":"<div class=mu>No decision yet. The bot decides whenever news moves a token's signal.</div>";
 if(d2&&d2.pend){$("ap").onclick=approve;$("rj").onclick=reject}
 $("sig").innerHTML=T.slice().sort(function(a,b){return Math.abs(b.sig)-Math.abs(a.sig)}).map(function(k){var w=Math.abs(k.sig)/2;return "<div class=sg><b>"+k.t+"</b><div class=g><i style='"+(k.sig>=0?"left:50%":"right:50%")+";width:"+w+"%;background:"+(k.sig>=0?"var(--up)":"var(--dn)")+"'></i></div><span class='m "+(k.sig>=0?"up":"dn")+"'>"+sg(k.sig)+"</span></div>"}).join("")+"<div class=mu style='font-size:12px'>Buy at ≥ +"+C.BUYT+". Sell held tokens at ≤ −"+C.SELLT+". Signals fade over time.</div>";
 $("pos").innerHTML=S.pos.length?S.pos.map(function(o,i){var c=K(o.t).p,pl=(c/o.entry-1)*o.size;return "<div class=pos><div class=row style='justify-content:space-between'><b>"+o.t+"</b><span class='m "+(pl>=0?"up":"dn")+"'>"+(pl>=0?"+":"")+"$"+f(pl)+"</span><button data-s='"+i+"'>Close</button></div><div class='m mu' style='font-size:12px'>$"+f(o.size,0)+" @ "+fp(o.entry)+" · stop "+fp(o.sl)+" · target "+fp(o.tp)+"</div><div class=mu style='font-size:12px'>Bought because: "+o.why+"</div></div>"}).join(""):"<div class=mu>No open position. The bot is waiting for a strong signal.</div>";
 function mt(l,v,m,t){var r=v/m;return "<div class=row style='justify-content:space-between'><span>"+l+"</span><span class='m mu'>"+t+"</span></div><div class=mt><i style='width:"+Math.min(100,r*100)+"%;background:"+(r>.85?"var(--dn)":r>.6?"var(--wn)":"var(--up)")+"'></i></div>"}
 $("risk").innerHTML=mt("Daily loss",Math.max(0,-S.day),C.DAILY,"$"+f(Math.max(0,-S.day),0)+" / $"+C.DAILY)+mt("Exposure",expo(),C.MAXE,"$"+f(expo(),0)+" / $"+C.MAXE);
 spark($("ch"),S.eh);
 $("buy").disabled=S.mode!=="MANUAL"||!S.on;$("kill").textContent=S.on?"Kill switch":"Re-enable trading";$("ban").style.display=S.on?"none":"block";
 $("live").className="pill"+(S.on?"":" off");$("lt").textContent=S.on?"WATCHING · simulated news":"TRADING DISABLED"}

$("tk").innerHTML=T.map(function(k){return "<option>"+k.t+"</option>"}).join("");
$("modes").onclick=function(e){var m=e.target.dataset.m;if(!m)return;S.mode=m;S.q=[];if(S.dec)S.dec.pend=false;log("MODE_CHANGED",m);render()};
$("buy").onclick=function(){var t=$("tk").value,sz=parseFloat($("sz").value);if(!(sz>0)){$("bm").textContent="Enter a size above 0.";return}
